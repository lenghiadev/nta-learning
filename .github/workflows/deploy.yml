name: NTA learning

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH Key
        run: |
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_KEY: ${{ secrets.EC2_KEY }}

      - name: Deploy to EC2
        run: |
          ssh $EC2_KEY $EC2_USER@$EC2_HOST << 'EOF'
            cd /var/www/html/nta-learning
            git pull origin main
            npm install
            npm run build
          EOF
